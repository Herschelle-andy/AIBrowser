<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="agentBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#263238" />
      <stop offset="100%" stop-color="#37474F" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#agentBg)" rx="16" />

  <!-- Action Card Container -->
  <g transform="translate(100, 45)" filter="url(#cardShadow)">
    <rect width="600" height="410" rx="12" fill="#FFFFFF" stroke="#CFD8DC" stroke-width="1" />
    
    <!-- Header -->
    <rect width="600" height="48" rx="12" fill="#F8F9FA" />
    <circle cx="28" cy="24" r="6" fill="#FF5F56" />
    <circle cx="48" cy="24" r="6" fill="#FFBD2E" />
    <circle cx="68" cy="24" r="6" fill="#27C93F" />
    <text x="300" y="29" font-family="sans-serif" font-size="13" font-weight="600" fill="#37474F" text-anchor="middle">🤖 Sahayak — Browser Action Agent</text>

    <!-- Step Badge & Headline -->
    <rect x="30" y="70" width="80" height="24" rx="4" fill="#E8F0FE" />
    <text x="70" y="86" font-family="sans-serif" font-size="11" font-weight="700" fill="#1A73E8" text-anchor="middle">STEP 2 of 4</text>
    
    <rect x="120" y="70" width="60" height="24" rx="4" fill="#E6F4EA" />
    <text x="150" y="86" font-family="sans-serif" font-size="11" font-weight="800" fill="#137333" text-anchor="middle">TYPE</text>

    <text x="30" y="125" font-family="sans-serif" font-size="16" font-weight="700" fill="#202124">Type "rahul@example.com" into Email field (#3)</text>
    
    <!-- Value Box -->
    <rect x="30" y="145" width="540" height="42" rx="6" fill="#F1F3F4" />
    <text x="45" y="171" font-family="monospace" font-size="13" fill="#1A73E8">value: "rahul@example.com"</text>

    <!-- Reasoning Box -->
    <rect x="30" y="200" width="540" height="55" rx="6" fill="#F8F9FA" stroke="#E0E0E0" stroke-width="1" />
    <text x="45" y="222" font-family="sans-serif" font-size="11" font-weight="700" fill="#5F6368">Reasoning:</text>
    <text x="45" y="242" font-family="sans-serif" font-size="12" fill="#3C4043">The form requires candidate contact email; mapped from local profile memory.</text>

    <!-- Consequential Notice -->
    <rect x="30" y="270" width="540" height="48" rx="6" fill="#FFF9E6" stroke="#F9AB00" stroke-width="1" />
    <text x="45" y="299" font-family="sans-serif" font-size="12" fill="#7C4A00">⚠️ Human in the loop: This action will write data into the active webpage.</text>

    <!-- Buttons -->
    <rect x="30" y="335" width="220" height="45" rx="8" fill="#1E8E3E" />
    <text x="140" y="363" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓ Approve Action</text>

    <rect x="260" y="335" width="140" height="45" rx="8" fill="#F1F3F4" stroke="#DADCE0" stroke-width="1" />
    <text x="330" y="363" font-family="sans-serif" font-size="14" font-weight="600" fill="#3C4043" text-anchor="middle">→ Skip</text>

    <rect x="410" y="335" width="160" height="45" rx="8" fill="#FCE8E6" stroke="#F5C2BD" stroke-width="1" />
    <text x="490" y="363" font-family="sans-serif" font-size="14" font-weight="700" fill="#C5221F" text-anchor="middle">✕ Stop Agent</text>
  </g>
</svg>

